<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoNode-VZ | Monitor de Resonancia</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div id="status-dot"></div>
            <span id="brand">SISMOLÓGICA ZENITHAL</span>
        </header>

        <section class="monitor-principal">
            <div id="alerta-banner" class="banner">SISTEMA OPERATIVO ✅</div>

            <div class="data-focus">
                <span class="label">MAGNITUD ACTUAL</span>
                <h2 id="valor-escala">1.1</h2>
                <span class="unit">Escala Zenithal</span>
            </div>

            <div class="graph-container">
                <canvas id="sismografo"></canvas>
            </div>
        </section>

        <nav class="controls-grid">
            <button class="btn btn-pdf" onclick="abrirDocumento()">📄 VER TESIS PDF</button>
            <button class="btn btn-maps" onclick="irAMapa()">📍 UBICACIÓN NODO</button>
            <button class="btn btn-sos" onclick="llamarEmergencia()">📞 EMERGENCIA</button>
        </nav>
        
        <footer class="footer-tecnico">
            <p>GeoNode-VZ | 3ro Telemática "B"</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
